packages:
  - "packages/*"
  - "examples/*"

# Vitest's Vite peer is auto-installed by pnpm; pin it so lockfile refreshes do
# not retain an older peer snapshot with stale Rolldown WASM peer metadata.
overrides:
  vite: 8.2.2

# @nestjs/core's postinstall is only a donation banner; never run it.
# esbuild arrives transitively (drizzle-kit, vite); its platform binary comes
# from an optional dependency, so its install script is not needed either.
allowBuilds:
  "@nestjs/core": false
  esbuild: false

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-express@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"

# `changeset publish` shells out to `pnpm publish`, and pnpm ignores
# package.json's publishConfig.provenance — setting it here takes pnpm's
# explicit-provenance branch, making a failed attestation a HARD publish
# error instead of a silent "Skipped setting provenance" warning.
provenance: true
